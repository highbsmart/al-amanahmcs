<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password | Al-Amanah MCS</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <img src="assets/logo.jpg" alt="KwaraCAILS crest">
      <div class="brand-text"><strong>Al-Amanah MCS</strong><span>Kwaracails &middot; Ilorin</span></div>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Member Login</a>
    </nav>
    <div class="nav-cta"><button class="nav-toggle" aria-label="Toggle menu">&#9776;</button></div>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <div class="brand"><img src="assets/logo.jpg" alt="Crest" style="width:52px;height:52px;"></div>
    <h1>Reset Your Password</h1>
    <p class="lede" id="resetLede">Choose a new password for your Al-Amanah MCS account.</p>

    <div class="form-error" id="resetError"></div>
    <div class="form-success" id="resetSuccess">Password updated — redirecting to login…</div>

    <form id="resetForm">
      <div class="field">
        <label for="newPassword">New password</label>
        <div style="position:relative;">
          <input type="password" id="newPassword" minlength="8" required autocomplete="new-password" style="padding-right:70px;">
          <button type="button" onclick="togglePw('newPassword',this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--green-700);font-size:12.5px;font-weight:600;cursor:pointer;">Show</button>
        </div>
        <div class="hint">At least 8 characters.</div>
      </div>
      <div class="field">
        <label for="newPassword2">Confirm new password</label>
        <div style="position:relative;">
          <input type="password" id="newPassword2" minlength="8" required autocomplete="new-password" style="padding-right:70px;">
          <button type="button" onclick="togglePw('newPassword2',this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--green-700);font-size:12.5px;font-weight:600;cursor:pointer;">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="resetBtn">Update password</button>
    </form>

    <div class="form-note" id="resetExpiredNote" style="margin-top:18px;display:none;">
      This link has expired or was already used. <a href="login.html">Request a new one from the login page &rarr;</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js?v=2"></script>
<script src="js/data-live.js?v=22"></script>
<script src="js/main.js?v=5"></script>
<script>
function togglePw(id, btn) {
  const input = document.getElementById(id);
  const showing = input.type === "text";
  input.type = showing ? "password" : "text";
  btn.textContent = showing ? "Show" : "Hide";
}
</script>
<script>
// supabase-js auto-detects the recovery token in the URL and opens a
// temporary session for it — but only for a moment. If nothing valid
// is found (expired/already-used link), there's no session, so we
// tell the member plainly instead of showing a form that can't work.
document.addEventListener("DOMContentLoaded", async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    document.getElementById("resetForm").style.display = "none";
    document.getElementById("resetLede").style.display = "none";
    document.getElementById("resetExpiredNote").style.display = "block";
  }
});

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("resetBtn");
  const errBox = document.getElementById("resetError");
  const okBox = document.getElementById("resetSuccess");
  errBox.classList.remove("show"); okBox.classList.remove("show");

  const p1 = document.getElementById("newPassword").value;
  const p2 = document.getElementById("newPassword2").value;
  if (p1 !== p2) {
    errBox.textContent = "Passwords do not match.";
    errBox.classList.add("show");
    return;
  }

  btn.disabled = true; btn.textContent = "Updating…";
  try {
    const { error } = await supabaseClient.auth.updateUser({ password: p1 });
    if (error) throw error;
    okBox.classList.add("show");
    await supabaseClient.auth.signOut();
    setTimeout(() => { window.location.href = "login.html"; }, 1600);
  } catch (err) {
    errBox.textContent = err.message || "Could not update your password. Please request a new reset link.";
    errBox.classList.add("show");
    btn.disabled = false; btn.textContent = "Update password";
  }
});
</script>
</body>
</html>
